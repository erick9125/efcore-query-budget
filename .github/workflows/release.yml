name: release

# The tag is the source of truth for the version: MinVer derives it from `v*`, so the package can
# never disagree with the commit it was built from. Cutting a release is `git tag v1.2.3 && git push --tags`.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer walks history and tags; a shallow clone would yield the wrong version.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: >
          dotnet test tests/EfCoreQueryBudget.Tests.Unit/EfCoreQueryBudget.Tests.Unit.csproj
          --no-build --configuration Release

      - name: Concurrency tests
        run: >
          dotnet test tests/EfCoreQueryBudget.Tests.Concurrency/EfCoreQueryBudget.Tests.Concurrency.csproj
          --no-build --configuration Release

      - name: Integration tests
        run: >
          dotnet test tests/EfCoreQueryBudget.Tests.Integration/EfCoreQueryBudget.Tests.Integration.csproj
          --no-build --configuration Release

      - name: Pack
        run: >
          dotnet pack src/EfCoreQueryBudget/EfCoreQueryBudget.csproj
          --no-build --configuration Release --output artifacts

      - name: Verify the package carries docs and symbols for every target framework
        run: |
          set -euo pipefail
          for tfm in net8.0 net9.0; do
            unzip -l artifacts/*.nupkg | grep -q "lib/$tfm/.*\.dll" || { echo "missing $tfm assembly"; exit 1; }
            unzip -l artifacts/*.nupkg | grep -q "lib/$tfm/.*\.xml" || { echo "missing $tfm XML docs"; exit 1; }
            unzip -l artifacts/*.snupkg | grep -q "lib/$tfm/.*\.pdb" || { echo "missing $tfm symbols"; exit 1; }
          done

      # Pushes the .snupkg alongside each .nupkg automatically.
      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          artifacts/*.nupkg artifacts/*.snupkg
          --title "${{ github.ref_name }}"
          --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
          --verify-tag
