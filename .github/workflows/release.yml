name: release

# The tag is the source of truth for the version: MinVer derives it from `v*`, so the package can
# never disagree with the commit it was built from. Cutting a release is `git tag v1.2.3 && git push --tags`.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Build and validate without publishing'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  # Required for NuGet trusted publishing: the API key is minted per run from this token, so there
  # is no long-lived secret to store or rotate.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Must match the environment named in the nuget.org trusted publishing policy.
    environment: nuget

    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer walks history and tags; a shallow clone would yield the wrong version.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version='${{ inputs.version }}'
            publish='${{ inputs.dry_run }}'
            [ "$publish" = "true" ] && publish=false || publish=true
          else
            version="${GITHUB_REF_NAME#v}"
            publish=true
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a valid semantic version."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (publish=$publish)"

      - name: Require a changelog entry
        run: |
          version='${{ steps.meta.outputs.version }}'
          if ! grep -Eq "^##+[[:space:]]+\[?v?${version}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version. Add one before tagging."
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.meta.outputs.version }}

      - name: Unit tests
        run: >
          dotnet test tests/EfCoreQueryBudget.Tests.Unit/EfCoreQueryBudget.Tests.Unit.csproj
          --no-build --configuration Release

      - name: Concurrency tests
        run: >
          dotnet test tests/EfCoreQueryBudget.Tests.Concurrency/EfCoreQueryBudget.Tests.Concurrency.csproj
          --no-build --configuration Release

      - name: Integration tests
        run: >
          dotnet test tests/EfCoreQueryBudget.Tests.Integration/EfCoreQueryBudget.Tests.Integration.csproj
          --no-build --configuration Release

      - name: Pack
        run: >
          dotnet pack src/EfCoreQueryBudget/EfCoreQueryBudget.csproj
          --no-build --configuration Release
          -p:Version=${{ steps.meta.outputs.version }}
          --output artifacts

      - name: Verify the package carries docs and symbols for every target framework
        run: |
          set -euo pipefail
          for tfm in net8.0 net9.0; do
            unzip -l artifacts/*.nupkg | grep -q "lib/$tfm/.*\.dll" || { echo "::error::missing $tfm assembly"; exit 1; }
            unzip -l artifacts/*.nupkg | grep -q "lib/$tfm/.*\.xml" || { echo "::error::missing $tfm XML docs"; exit 1; }
            unzip -l artifacts/*.snupkg | grep -q "lib/$tfm/.*\.pdb" || { echo "::error::missing $tfm symbols"; exit 1; }
          done
          echo "Package contents verified."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      # Trusted publishing: nuget.org validates this repository, workflow file and environment
      # against its policy and issues a short-lived key. Nothing is stored in GitHub secrets.
      - name: NuGet login (OIDC)
        if: steps.meta.outputs.publish == 'true'
        id: login
        uses: NuGet/login@v1
        with:
          user: erickmorales91

      # Pushes the .snupkg alongside each .nupkg automatically.
      - name: Push to NuGet
        if: steps.meta.outputs.publish == 'true'
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create the GitHub release
        if: steps.meta.outputs.publish == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          artifacts/*.nupkg artifacts/*.snupkg
          --title "${GITHUB_REF_NAME}"
          --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
          --verify-tag
